<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  
  <head th:replace="~{layout/base :: head}"></head>
  
  <body>
  	<div class="container-fluid"> <header class="row">
		<nav th:replace="~{layout/base :: navBar}"></nav>
	  </header>
	  
	  <main class="row">
		  
          <section class="col-12 p-5"> 
          	
            <h3 class="text-primary">Reporte General de Letras (Cuentas por Cobrar)</h3>
		  	
			<table class="table table-striped table-hover">
			  <thead>
			    <tr>
			      <th scope="col">Número de Letra</th>
			      <th scope="col">Factura Aso.</th>
			      <th scope="col">N° Cuota</th>
			      <th scope="col">Monto</th>
			      <th scope="col">Fecha Vencim.</th>
                  <th scope="col">Estado</th>
			      <th scope="col" class="text-center">Ver Detalles</th>
			      <th scope="col" class="text-center">Anular</th>
			    </tr>
			  </thead>
			  <tbody>
                <tr th:each="l : ${letras}">
			      <th scope="row" th:text="${l.numeroLetra}">2025-0001</th>
                  
                  <td th:text="${l.planillaLetra.factura.numeroFactura}">F001-00000001</td>
			      
                  <td th:text="${l.numeroCuota}">1/2</td>
                  
                  <td th:text="${#numbers.formatCurrency(l.monto)}">$ 750.00</td>
                  
                  <td th:text="${#temporals.format(l.fechaVencimiento, 'dd/MM/yyyy')}">15/11/2025</td>
                  
                  <td th:text="${l.estado}">Generada</td>
			      
                  <td class="text-center">
			      	<a th:href="@{/letras/ver/{id}(id=${l.idLetra})}">
			      		<i class="bi bi-eye-fill text-info"></i>
			      	</a>
			      </td>
			      
                  <td class="text-center">
			      	<a th:href="@{/letras/anular/{id}(id=${l.idLetra})}"
			      		class="btn-eliminar" th:data-id="${l.numeroLetra}"> <i class="bi bi-trash text-danger"></i>
			      	</a>
			      </td>
			    </tr>
			    
			  </tbody>
			</table>
		  </section>
		  
	  </main>
      
      <footer th:replace="~{layout/base :: footer}"></footer>
	  
      <script th:replace="~{layout/base :: sweetAlerts(
        mensajeExito = ${guardadoExitoso}, 
        mensajeError = ${error}, 
        tipoItem = 'Letra'
      )}"></script>

  </div>
  </body>
</html>
