<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  
  <head th:replace="~{layout/base :: head}"></head>
  
  <body>
  	<div class="container">
	  
      <header class="row">
		<nav th:replace="~{layout/base :: navBar}"></nav>
	  </header>
	  
	  <main class="row">
		  
          <section class="col-12 p-5"> 
          	
            <h3 class="text-primary">Listado de Facturas Emitidas</h3>
		  	
			<table class="table table-striped table-hover">
			  <thead>
			    <tr>
			      <th scope="col">Pedido ID</th>
			      <th scope="col">Número de  Factura</th>
			      <th scope="col">Fecha Emisión</th>
			      <th scope="col">Fecha Vencim.</th>
			      <th scope="col">Monto Total</th>
                  <th scope="col">Estado</th>
			      <th scope="col" class="text-center">Ver Detalles</th>
			      <th scope="col" class="text-center">Anular</th>
			    </tr>
			  </thead>
			  <tbody>
                <tr th:each="f : ${facturas}">
			      <th scope="row" th:text="${f.numeroFactura}">F001-00000001</th>
			      <td th:text="${f.pedido.idPedido}">1</td>
                  
                  <td th:text="${#temporals.format(f.fechaEmision, 'dd/MM/yyyy')}">15/10/2025</td>
			      <td th:text="${#temporals.format(f.fechaVencimiento, 'dd/MM/yyyy')}">15/11/2025</td>
                  
                  <td th:text="${#numbers.formatCurrency(f.montoTotal)}">$ 1,500.00</td>
                  <td th:text="${f.estado}">Pendiente</td>
			      
                  <td class="text-center">
			      	<a th:href="@{/facturas/ver/{id}(id=${f.idFactura})}">
			      		<i class="bi bi-eye-fill text-info"></i>
			      	</a>
			      </td>
			      
                  <td class="text-center">
			      	<a th:href="@{/facturas/anular/{id}(id=${f.idFactura})}"
			      		class="btn-eliminar" th:data-id="${f.numeroFactura}"> <i class="bi bi-trash text-danger"></i>
			      	</a>
			      </td>
			    </tr>
			    
			  </tbody>
			</table>
		  </section>
		  
	  </main>
      
      <footer th:replace="~{layout/base :: footer}"></footer>
	  
      <script th:replace="~{layout/base :: sweetAlerts(
        mensajeExito = ${guardadoExitoso}, 
        mensajeError = ${error}, 
        tipoItem = 'Factura'
      )}"></script>

  </div>
  </body>
</html>
