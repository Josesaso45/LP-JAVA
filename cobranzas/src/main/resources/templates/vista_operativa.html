<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head}"></head>
<body>
    <div class="container">
        <header class="row">
            <nav th:replace="~{layout/base :: navBar}"></nav>
        </header>
        <main class="row justify-content-center">
            <section class="col-lg-10 col-md-12 col-sm-12 p-5">
                <h3 class="text-primary mb-4">Vista Operativa - Trazabilidad de Letras</h3>

                <table id="letrasTable" class="table table-striped table-bordered" style="width:100%">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Número Letra</th>
                            <th>Fecha Vencimiento</th>
                            <th>Monto</th>
                            <th>Pagada</th>
                            <th>Factura ID</th>
                            <th>Cliente RUC</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- DataTables will populate this -->
                    </tbody>
                </table>

            </section>
        </main>
        <footer th:replace="~{layout/base :: footer}"></footer>
    </div>

    <!-- DataTables CSS and JS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.css">
    <script type="text/javascript" charset="utf8" src="https://code.jquery.com/jquery-3.5.1.js"></script>
    <script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.js"></script>

    <script>
        $(document).ready(function() {
            $('#letrasTable').DataTable({
                "ajax": {
                    "url": "/operativo/letras",
                    "dataSrc": ""
                },
                "columns": [
                    { "data": "id" },
                    { "data": "numeroLetra" },
                    { "data": "fechaVencimiento" },
                    { "data": "monto" },
                    { "data": "pagada" },
                    { "data": "factura.id" },
                    { "data": "factura.cliente.ruc" }
                ]
            });
        });
    </script>
</body>
</html>
