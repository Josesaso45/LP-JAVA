<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head}"></head>
<body>
    <div class="container">
        <header class="row">
            <nav th:replace="~{layout/base :: navBar}"></nav>
        </header>
        <main class="row justify-content-center">
            <section class="col-lg-10 col-md-12 col-sm-12 p-5">
                <h3 class="text-primary mb-4">Dashboard Ejecutivo</h3>

                <!-- KPI Cards -->
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="card text-white bg-primary mb-3">
                            <div class="card-header">Total Facturado</div>
                            <div class="card-body">
                                <h5 class="card-title" th:text="${kpis.totalFacturado}"></h5>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-white bg-warning mb-3">
                            <div class="card-header">Facturas Pendientes</div>
                            <div class="card-body">
                                <h5 class="card-title" th:text="${kpis.facturasPendientes}"></h5>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-white bg-danger mb-3">
                            <div class="card-header">Monto Pendiente</div>
                            <div class="card-body">
                                <h5 class="card-title" th:text="${kpis.montoPendiente}"></h5>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-white bg-success mb-3">
                            <div class="card-header">TPC</div>
                            <div class="card-body">
                                <h5 class="card-title" th:text="${kpis.tpc}"></h5>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Aging Chart -->
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">Aging de Cartera</div>
                            <div class="card-body">
                                <canvas id="agingChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

            </section>
        </main>
        <footer th:replace="~{layout/base :: footer}"></footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const agingData = /*[[${agingJson}]]*/ '[]';
        const parsedAgingData = JSON.parse(agingData);

        const labels = parsedAgingData.map(data => data.ageRange);
        const dataValues = parsedAgingData.map(data => data.totalDebt);

        const ctx = document.getElementById('agingChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Monto de Deuda',
                    data: dataValues,
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.2)',
                        'rgba(255, 159, 64, 0.2)',
                        'rgba(255, 205, 86, 0.2)',
                        'rgba(75, 192, 192, 0.2)'
                    ],
                    borderColor: [
                        'rgb(255, 99, 132)',
                        'rgb(255, 159, 64)',
                        'rgb(255, 205, 86)',
                        'rgb(75, 192, 192)'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
        /*]]>*/
    </script>
</body>
</html>
